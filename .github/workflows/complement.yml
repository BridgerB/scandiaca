name: Complement

# Run the standard Matrix Complement integration suite against scandiaca on a
# clean GitHub-hosted runner (fresh Ubuntu VM with Docker — consistent every
# time, no contention with a local machine). Trigger it by hand from the Actions
# tab; results upload as an artifact and a pass/fail summary is written to the
# run page.
on:
  workflow_dispatch:
    inputs:
      run:
        description: "Optional -run regex (blank = whole suite, e.g. TestFederationRoomsInvite)"
        required: false
        default: ""
      go_timeout:
        description: "go test -timeout value"
        required: false
        default: "90m"
      parallel:
        description: "Max concurrent tests (go test -parallel). Low = less memory; the runner OOMs if too high."
        required: false
        default: "2"
      complement_ref:
        description: "matrix-org/complement git ref to pin"
        required: false
        default: "61af6754f4a4247094fdf7798bc0e7f290ee1968"

# Let a new manual run supersede an in-flight one.
concurrency:
  group: complement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complement:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout scandiaca
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Add swap
        run: |
          # Runs have been SIGTERM-killed (exit 143) ~70 min in regardless of
          # test parallelism — the signature of the runner OOMing. Give it a big
          # swapfile so memory pressure spills to disk instead of killing the VM.
          sudo swapoff -a || true
          sudo fallocate -l 13G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -m

      - name: Build the scandiaca Complement image
        run: docker build -t complement-scandiaca -f Dockerfile.complement .

      - name: Fetch Complement
        run: |
          mkdir -p "$RUNNER_TEMP/complement"
          cd "$RUNNER_TEMP/complement"
          REF="${{ github.event.inputs.complement_ref }}"
          [ -n "$REF" ] || REF="main"
          git init -q
          git remote add origin https://github.com/matrix-org/complement.git
          # Shallow-fetch the ref directly (works for a branch/tag or a tip SHA);
          # fall back to fetching main's history and checking out an ancestor SHA.
          if git fetch -q --depth 1 origin "$REF"; then
            git checkout -q FETCH_HEAD
          else
            git fetch -q origin main
            git checkout -q "$REF"
          fi
          echo "Complement at: $(git rev-parse --short HEAD)"

      - name: Run Complement
        id: run
        working-directory: ${{ runner.temp }}/complement
        env:
          COMPLEMENT_BASE_IMAGE: complement-scandiaca
          GOTOOLCHAIN: auto
        run: |
          set -o pipefail
          # Stream resource usage to the live console every 30s. Console logs are
          # preserved even if the runner is killed, so this reveals memory/disk
          # pressure that the (skipped-on-death) artifact upload would hide.
          ( while true; do
              echo "[rsrc $(date -u +%H:%M:%S)] $(free -m | awk '/Mem:/{printf "mem %s/%sMB",$3,$2} /Swap:/{printf " swap %s/%sMB",$3,$2}') $(df -m / | awk 'NR==2{printf " disk_free %sMB",$4}') containers=$(docker ps -q | wc -l | tr -d ' ')"
              sleep 30
            done ) &
          MON=$!

          : > "$GITHUB_WORKSPACE/complement.jsonl"
          : > "$GITHUB_WORKSPACE/complement.stderr.log"

          # A long-lived process (the go-test harness and/or dockerd) leaks memory
          # across the full suite: RAM + swap climb to ~29 GB with only 2 containers
          # ever live, so a single `go test ./tests/...` OOM-kills the runner ~70 min
          # in. Run the suite in chunks, restarting go (and the docker daemon)
          # between chunks so the accumulated memory is released each time.
          LIST_PAT='.*'
          [ -n "${{ github.event.inputs.run }}" ] && LIST_PAT="${{ github.event.inputs.run }}"
          mapfile -t TESTS < <(go test ./tests/... -list "$LIST_PAT" 2>/dev/null | grep -E '^Test' | sort -u)
          total=${#TESTS[@]}
          echo "Discovered $total top-level tests"
          CHUNKS=6
          per=$(( (total + CHUNKS - 1) / CHUNKS ))
          [ "$per" -lt 1 ] && per=1
          i=0; chunk=0
          while [ "$i" -lt "$total" ]; do
            chunk=$((chunk + 1))
            slice=( "${TESTS[@]:i:per}" )
            i=$((i + per))
            regex="^($(IFS='|'; echo "${slice[*]}"))$"
            echo "::group::chunk $chunk (${#slice[@]} tests)"
            # -p 1 + -parallel N caps concurrent homeserver deployments; stderr is
            # tee'd live; jsonl is appended across chunks for one combined result.
            go test -json -count=1 -p 1 -parallel "${{ github.event.inputs.parallel }}" \
              -timeout "${{ github.event.inputs.go_timeout }}" -run "$regex" ./tests/... \
              >> "$GITHUB_WORKSPACE/complement.jsonl" \
              2> >(tee -a "$GITHUB_WORKSPACE/complement.stderr.log" >&2) || true
            echo "::endgroup::"
            # Release memory held by dockerd/go before the next chunk. prune WITHOUT
            # -a so the tagged base image survives the restart.
            docker system prune -f --volumes >/dev/null 2>&1 || true
            sudo systemctl restart docker || true
            for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          done
          kill "$MON" 2>/dev/null || true
          echo "done"

      - name: Summarise results
        if: always()
        run: |
          python3 - "$GITHUB_WORKSPACE/complement.jsonl" <<'PY' | tee "$GITHUB_WORKSPACE/complement-summary.txt" >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          top = {}        # top-level test (no "/") -> last terminal action
          fails = []
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              line = line.strip()
              if not line or not line.startswith("{"):
                  continue
              try:
                  o = json.loads(line)
              except Exception:
                  continue
              t = o.get("Test", "")
              a = o.get("Action", "")
              if not t or "/" in t:
                  continue
              if a in ("pass", "fail", "skip"):
                  top[t] = a
          p = sum(1 for v in top.values() if v == "pass")
          f = sum(1 for v in top.values() if v == "fail")
          s = sum(1 for v in top.values() if v == "skip")
          pct = round(100 * p / (p + f), 1) if (p + f) else 0.0
          fails = sorted(t for t, v in top.items() if v == "fail")
          print(f"# Complement: scandiaca\n")
          print(f"**{p}/{p+f} passed  ({pct}%)**  —  {p} pass, {f} fail, {s} skip\n")
          if fails:
              print("## Failing (top-level)\n")
              for t in fails:
                  print(f"- `{t}`")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complement-results
          path: |
            complement.jsonl
            complement.stderr.log
            complement-summary.txt
          retention-days: 30
